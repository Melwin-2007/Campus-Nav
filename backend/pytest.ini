[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    tier1: Tier 1 Feature Coverage tests (Health, Categories, Locations, Search, Routing, Snapping, Accessibility, Admin, QR)
    tier2: Tier 2 Boundary & Corner Cases tests (Disconnected, GPS >300m, Empty search, Unicode, Same start/dest, Negative distance, Invalid tokens)
    tier3: Tier 3 Cross-Feature Combination tests (Pairwise workflows)
    tier4: Tier 4 Real-World Application Scenario tests (End-to-end user workflows)
    e2e: Master End-to-End System Verification tests
filterwarnings =
    ignore::DeprecationWarning
